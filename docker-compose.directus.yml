services:
  directus:
    image: directus/directus:11
    restart: unless-stopped
    ports:
      - "127.0.0.1:8055:8055"
    environment:
      KEY: "sankeng-directus-key"
      SECRET: "sankeng-directus-secret-change-in-production"
      DB_CLIENT: "pg"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "sankeng"
      DB_USER: "sankeng"
      DB_PASSWORD: "sankeng"
      ADMIN_EMAIL: "admin@sankengcloset.com"
      ADMIN_PASSWORD: "${DIRECTUS_ADMIN_PASSWORD:-sankeng2025}"
      WEBSOCKETS_ENABLED: "false"
      FILE_MAX_SIZE: "10"
      UPLOAD_DIR: "/directus/uploads"
    volumes:
      - sankeng_directus/uploads:/directus/uploads
      - sankeng_directus/database:/directus/database
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

volumes:
  sankeng_directus/uploads:
  sankeng_directus/database:

networks:
  default:
    name: sankengcloset_service_default
    external: true
