# sankengcloset 基础设施 — PostgreSQL
# PostgreSQL 不暴露公网端口
# 使用 docker-compose v1 语法

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sankeng
      POSTGRES_USER: sankeng
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - sankeng_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sankeng -d sankeng"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    # 不映射端口到公网，仅 Docker 内部网络访问

networks:
  internal:
    internal: true

volumes:
  sankeng_pgdata:
